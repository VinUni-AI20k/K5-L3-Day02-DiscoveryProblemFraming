<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .box { rx: 10px; ry: 10px; stroke-width: 2px; }
      .box-rule { fill: #f0f9ff; stroke: #0284c7; }
      .box-human { fill: #f0fdf4; stroke: #16a34a; }
      .box-ai { fill: #faf5ff; stroke: #9333ea; }
      .box-hitl { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5px; }
      .badge { rx: 4px; ry: 4px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .step-time { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #64748b; text-anchor: middle; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5px; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #94a3b8; }
      .panel { rx: 8px; stroke-width: 1.5px; }
      .panel-boundary { fill: #f8fafc; stroke: #cbd5e1; }
      .panel-fallback { fill: #fefce8; stroke: #ca8a04; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .panel-content { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="480" fill="#ffffff" rx="12" />

  <!-- Header -->
  <text x="35" y="40" class="title">Quy trình tương lai — 6 bước (Kỳ vọng: &lt; 5 phút thao tác mỗi tối)</text>
  <text x="35" y="63" class="subtitle">Mô hình lai (Hybrid): Rule iCal + AI trích xuất tin nhắn + Human-in-the-loop (Duyệt Digest 22h00)</text>

  <!-- Step 1 (RULE) -->
  <g transform="translate(35, 90)">
    <rect width="155" height="155" class="box box-rule" />
    <rect x="35" y="12" width="85" height="20" rx="10" fill="#bae6fd" />
    <text x="77" y="26" class="badge-text" fill="#0369a1">RULE (iCal)</text>
    <text x="77" y="68" class="step-title">Đồng bộ LMS</text>
    <text x="77" y="90" class="step-time" fill="#0284c7">⚡ Tự động 100%</text>
    <text x="77" y="115" class="step-desc">Đồng bộ hạn nộp</text>
    <text x="77" y="130" class="step-desc">chính thức qua iCal</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 190 167 L 210 167" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2 (HUMAN) -->
  <g transform="translate(215, 90)">
    <rect width="155" height="155" class="box box-human" />
    <rect x="25" y="12" width="105" height="20" rx="10" fill="#bbf7d0" />
    <text x="77" y="26" class="badge-text" fill="#15803d">CON NGƯỜI</text>
    <text x="77" y="68" class="step-title">Dán / Forward tin</text>
    <text x="77" y="90" class="step-time" fill="#16a34a">⏱ 1–2 phút</text>
    <text x="77" y="115" class="step-desc">Chủ động gửi tin dặn</text>
    <text x="77" y="130" class="step-desc">từ Zalo/Email cho bot</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 370 167 L 390 167" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3 (AI) -->
  <g transform="translate(395, 90)">
    <rect width="155" height="155" class="box box-ai" />
    <rect x="35" y="12" width="85" height="20" rx="10" fill="#f3e8ff" />
    <text x="77" y="26" class="badge-text" fill="#7e22ce">AI PARSER</text>
    <text x="77" y="68" class="step-title">Trích xuất thực thể</text>
    <text x="77" y="90" class="step-time" fill="#9333ea">⚡ &lt; 1 phút</text>
    <text x="77" y="115" class="step-desc">Bóc tách: Môn, Bài,</text>
    <text x="77" y="130" class="step-desc">Hạn nộp, Câu nguồn</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 550 167 L 570 167" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 4 (RULE) -->
  <g transform="translate(575, 90)">
    <rect width="155" height="155" class="box box-rule" />
    <rect x="35" y="12" width="85" height="20" rx="10" fill="#bae6fd" />
    <text x="77" y="26" class="badge-text" fill="#0369a1">RULE</text>
    <text x="77" y="68" class="step-title">Tạo Daily Digest</text>
    <text x="77" y="90" class="step-time" fill="#0284c7">⚡ Tự động 22h00</text>
    <text x="77" y="115" class="step-desc">Gộp trùng lịch LMS,</text>
    <text x="77" y="130" class="step-desc">soạn bản tin ≤ 5 dòng</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 730 167 L 750 167" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 5 (HITL) -->
  <g transform="translate(755, 90)">
    <rect width="155" height="155" class="box box-hitl" />
    <rect x="25" y="12" width="105" height="20" rx="10" fill="#ffedd5" />
    <text x="77" y="26" class="badge-text" fill="#c2410c">CON NGƯỜI (HITL)</text>
    <text x="77" y="68" class="step-title">Duyệt &amp; Xác nhận</text>
    <text x="77" y="90" class="step-time" fill="#ea580c">⏱ ~2 phút</text>
    <text x="77" y="115" class="step-desc">Kiểm tra thông tin,</text>
    <text x="77" y="130" class="step-desc">bấm nút đồng ý lưu</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 910 167 L 930 167" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 6 (RULE) -->
  <g transform="translate(935, 90)">
    <rect width="130" height="155" class="box box-rule" />
    <rect x="22" y="12" width="85" height="20" rx="10" fill="#bae6fd" />
    <text x="65" y="26" class="badge-text" fill="#0369a1">RULE</text>
    <text x="65" y="68" class="step-title">Lưu &amp; Nhắc hạn</text>
    <text x="65" y="90" class="step-time" fill="#0284c7">⚡ Tự động</text>
    <text x="65" y="115" class="step-desc">Ghi Google Calendar,</text>
    <text x="65" y="130" class="step-desc">nhắc trước 24 giờ</text>
  </g>

  <!-- Bottom Panel 1: BOUNDARY -->
  <g transform="translate(35, 270)">
    <rect width="505" height="180" class="panel panel-boundary" />
    <text x="20" y="30" class="panel-title" fill="#0f172a">🛡️ RANH GIỚI AN TOÀN (BOUNDARY):</text>
    <text x="20" y="55" class="panel-content">• AI chỉ xử lý văn bản do sinh viên chủ động dán hoặc forward.</text>
    <text x="20" y="75" class="panel-content">• AI KHÔNG đăng nhập, KHÔNG đọc tài khoản Zalo, Email hay LMS cá nhân.</text>
    <text x="20" y="95" class="panel-content">• Dữ liệu LMS đi qua chuẩn iCal feed (Rule), không cho LLM suy diễn.</text>
    <text x="20" y="115" class="panel-content">• Nguồn không nêu rõ hạn thì AI ghi "thiếu thông tin", cấm tự bịa giờ.</text>
    <text x="20" y="135" class="panel-content">• AI KHÔNG tự tạo/xóa lịch; bắt buộc sinh viên bấm duyệt ở Bước 5.</text>
  </g>

  <!-- Bottom Panel 2: FALLBACK -->
  <g transform="translate(560, 270)">
    <rect width="505" height="180" class="panel panel-fallback" />
    <text x="20" y="30" class="panel-title" fill="#a16207">🔄 PHƯƠNG ÁN QUAY VỀ (FALLBACK):</text>
    <text x="20" y="55" class="panel-content">• Khi AI trích sai, bỏ sót hoặc hệ thống AI gặp lỗi / mất kết nối:</text>
    <text x="20" y="75" class="panel-content">  Sinh viên lập tức bỏ bản nháp và quay về đối chiếu thủ công 4 nguồn.</text>
    <text x="20" y="100" class="panel-content">• Lịch LMS từ chuẩn iCal và Rule nhắc hẹn của Google Calendar vẫn chạy</text>
    <text x="20" y="120" class="panel-content">  bình thường 100% vì hoàn toàn độc lập, không phụ thuộc vào LLM.</text>
    <text x="20" y="145" class="panel-content">• Ngưỡng dừng: Nếu tỷ lệ trích xuất lỗi vượt quá 20% trong tuần pilot,</text>
    <text x="20" y="160" class="panel-content">  hệ thống sẽ tạm dừng bước AI và chuyển về chế độ nhắc việc iCal thuần túy.</text>
  </g>
</svg>

