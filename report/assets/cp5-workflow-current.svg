<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box { rx: 10px; ry: 10px; stroke-width: 2px; }
      .box-normal { fill: #f8fafc; stroke: #cbd5e1; }
      .box-bottleneck { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5px; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .step-time { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .badge-bottleneck { fill: #e11d48; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill-opacity: 1; text-anchor: middle; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5px; fill: none; stroke-linecap: round; }
      .arrow-head { fill: #94a3b8; }
      .summary-box { fill: #f1f5f9; stroke: #e2e8f0; rx: 8px; }
      .summary-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrow-head" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="360" fill="#ffffff" rx="12" />

  <!-- Header -->
  <text x="40" y="45" class="title">Quy trình hiện tại — 5 bước thủ công (Baseline: ~18 phút/tối)</text>
  <text x="40" y="70" class="subtitle">Sinh viên tự đối chiếu từ 4 kênh độc lập • Lặp lại 4–5 tối/tuần • 5/5 bước hoàn toàn thủ công</text>

  <!-- Step 1 -->
  <g transform="translate(40, 100)">
    <rect width="155" height="150" class="box box-normal" />
    <circle cx="28" cy="28" r="14" fill="#e2e8f0" />
    <text x="28" y="32" class="step-num" fill="#475569">01</text>
    <text x="77" y="75" class="step-title">Mở LMS Canvas</text>
    <text x="77" y="98" class="step-time">⏱ ~3 phút</text>
    <text x="77" y="125" class="step-desc">Xem bài tập mới &amp;</text>
    <text x="77" y="140" class="step-desc">hạn nộp chính thức</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 195 175 L 225 175" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 2 -->
  <g transform="translate(230, 100)">
    <rect width="155" height="150" class="box box-normal" />
    <circle cx="28" cy="28" r="14" fill="#e2e8f0" />
    <text x="28" y="32" class="step-num" fill="#475569">02</text>
    <text x="77" y="75" class="step-title">Check Email trường</text>
    <text x="77" y="98" class="step-time">⏱ ~2 phút</text>
    <text x="77" y="125" class="step-desc">Lọc thư thông báo</text>
    <text x="77" y="140" class="step-desc">giảng viên dời hạn</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 385 175 L 415 175" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3 (BOTTLENECK) -->
  <g transform="translate(420, 100)">
    <rect width="170" height="150" class="box box-bottleneck" />
    <rect x="25" y="12" width="120" height="22" rx="11" fill="#fee2e2" />
    <text x="85" y="27" class="badge-bottleneck">⚠️ BOTTLENECK CHÍNH</text>
    <text x="85" y="75" class="step-title" fill="#be123c">Đọc Zalo lớp/môn</text>
    <text x="85" y="98" class="step-time" fill="#be123c">⏱ ~6 phút/tối</text>
    <text x="85" y="123" class="step-desc">Lội tin nhắn tự do,</text>
    <text x="85" y="138" class="step-desc">dễ trôi tin dặn bài</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 590 175 L 620 175" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 4 -->
  <g transform="translate(625, 100)">
    <rect width="155" height="150" class="box box-normal" />
    <circle cx="28" cy="28" r="14" fill="#e2e8f0" />
    <text x="28" y="32" class="step-num" fill="#475569">04</text>
    <text x="77" y="75" class="step-title">Tra cứu Drive môn</text>
    <text x="77" y="98" class="step-time">⏱ ~3 phút</text>
    <text x="77" y="125" class="step-desc">Đọc rubric đề bài,</text>
    <text x="77" y="140" class="step-desc">file dặn dò bổ sung</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 780 175 L 810 175" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 5 -->
  <g transform="translate(815, 100)">
    <rect width="155" height="150" class="box box-normal" />
    <circle cx="28" cy="28" r="14" fill="#e2e8f0" />
    <text x="28" y="32" class="step-num" fill="#475569">05</text>
    <text x="77" y="75" class="step-title">Ghi chép sổ/app</text>
    <text x="77" y="98" class="step-time">⏱ ~4 phút</text>
    <text x="77" y="125" class="step-desc">Gõ tay to-do list,</text>
    <text x="77" y="140" class="step-desc">dễ sai sót hoặc quên</text>
  </g>

  <!-- Footer Stats -->
  <g transform="translate(40, 280)">
    <rect width="930" height="55" class="summary-box" />
    <text x="25" y="32" class="summary-text">📊 Tổng thời gian: ~18 phút/tối (≈ 1.8 giờ/tuần) • Thao tác thủ công: 5/5 bước • Tần suất bỏ sót: ~1 deadline/tháng</text>
  </g>
</svg>

